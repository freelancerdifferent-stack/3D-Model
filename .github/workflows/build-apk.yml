name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Patch FBX parser to Assimp WASM
        run: python3 tools/patch_fbx_assimp.py

      - name: Patch universal Layers
        run: python3 tools/patch_layers.py

      - name: Verify Assimp and Layers pipeline
        run: |
          grep -q "assimpjs@0.0.10" app/src/main/assets/index.html
          grep -q "loadFbxWithAssimp" app/src/main/assets/index.html
          grep -q "ConvertFileList(fileList,'glb2')" app/src/main/assets/index.html
          grep -q 'id="layersScreen"' app/src/main/assets/index.html
          grep -q "Add Layer (FBX / GLB / PNG)" app/src/main/assets/index.html
          grep -q "let sceneLayers=\[\]" app/src/main/assets/index.html
          grep -q "layerOpacity" app/src/main/assets/index.html

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3D-Model-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
