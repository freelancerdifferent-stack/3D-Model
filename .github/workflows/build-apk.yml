name: Build Android APK

on:
  push:
    branches: [ "main", "GPT2", "Kodok" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: actions/setup-node@v4
      - name: Bundle offline runtime
        run: |
          rm -rf /tmp/df3d-runtime app/src/main/assets/vendor
          mkdir -p /tmp/df3d-runtime app/src/main/assets/vendor/three app/src/main/assets/vendor/assimpjs
          cd /tmp/df3d-runtime && npm init -y >/dev/null 2>&1 && npm install --no-audit --no-fund three@0.180.0 assimpjs@0.0.10
          cp -R node_modules/three/build "$GITHUB_WORKSPACE/app/src/main/assets/vendor/three/build"
          cp -R node_modules/three/examples "$GITHUB_WORKSPACE/app/src/main/assets/vendor/three/examples"
          cp -R node_modules/assimpjs/dist "$GITHUB_WORKSPACE/app/src/main/assets/vendor/assimpjs/dist"
      - name: Apply editor pipeline
        run: |
          python3 tools/patch_fbx_assimp.py
          python3 tools/patch_fbx_viewer_repair_v38.py
          python3 tools/patch_layers_v2.py
          python3 tools/patch_mesh_layers.py
          python3 tools/patch_part_drag.py
          python3 tools/patch_part_rotate_scale.py
          python3 tools/patch_part_axis_lock.py
          python3 tools/patch_part_drag_android_fix.py
          python3 tools/patch_part_transform_stability.py
          python3 tools/patch_part_longpress_menu.py
          python3 tools/patch_mesh_part_lock.py
          python3 tools/patch_mesh_part_lock_v2.py
          python3 tools/patch_part_longpress_fix_v2.py
          python3 tools/patch_live_edit_select.py
          python3 tools/patch_live_edit_orbit_trackpad_v8.py
          python3 tools/patch_live_edit_transform.py
          python3 tools/patch_live_edit_transform_v2.py
          python3 tools/patch_live_edit_selection_state_v2.py
          python3 tools/patch_live_edit_state_v3.py
          python3 tools/patch_live_edit_touch_transform_v3.py
          python3 tools/patch_live_edit_touch_transform_v4.py
          python3 tools/patch_live_edit_touch_transform_v5.py
          python3 tools/patch_project_manager.py
          python3 tools/patch_project_folder_saf.py
          python3 tools/patch_project_saf_uri_v17.py
          python3 tools/patch_project_import_v18.py
          python3 tools/patch_project_export_v19.py
          python3 tools/patch_project_roundtrip_v20.py
          python3 tools/patch_skinned_mesh_direct_v6.py
          python3 tools/patch_live_edit_visual_preview_v7.py
          python3 tools/patch_object_ui_v9.py
          python3 tools/patch_object_portals_v30.py
          python3 tools/patch_remove_recent_files_v31.py
          python3 tools/patch_skeleton_live_edit_v20.py
          python3 tools/patch_skeleton_trackpad_zoom_v27.py
          python3 tools/patch_transform_adjust_scrub_v11.py
          python3 tools/patch_skeleton_tool_routes_v21.py
          python3 tools/patch_skeleton_visual_v23.py
          python3 tools/patch_skeleton_bone_manage_v24.py
          python3 tools/patch_skeleton_rig_v26.py
          python3 tools/patch_skeleton_undo_redo_v29.py
          python3 tools/patch_export_all_v13.py
          python3 tools/patch_mesh_transform_panel_v14.py
          python3 tools/patch_mesh_layer_manage_v16.py
          python3 tools/patch_live_edit_select_undo_v28.py
          python3 tools/patch_adaptive_floor_grid_v17.py
          python3 tools/patch_offline_runtime.py
          python3 tools/patch_mode_storage_split_v40.py
          python3 tools/patch_export_skinned_clone_v44.py
          python3 tools/patch_fbx_primary_fbxloader_v55.py
          python3 tools/patch_create_machine_v32.py
          python3 tools/patch_auto_machine_v39.py
          python3 tools/patch_auto_rig_portal_v41.py
          python3 tools/patch_auto_rig_replace_old_v50.py
          python3 tools/patch_auto_rig_bone_tidy_v51.py
          python3 tools/patch_anim_library_v52.py
          python3 tools/patch_auto_rig_weights_v53.py
          python3 tools/patch_auto_rig_align_v54.py
          python3 tools/patch_anim_lib_smartmap_v56.py
          python3 tools/patch_auto_rig_mode_v57.py
          python3 tools/patch_anim_lib_groups_v58.py
          python3 tools/patch_anim_lib_bindpose_v59.py
          python3 tools/patch_anim_lib_restoffset_v60.py
          python3 tools/patch_anim_lib_legscopy_v61.py
          python3 tools/patch_anim_lib_groundface_v62.py
          python3 tools/patch_anim_lib_armscopy_v63.py
          python3 tools/patch_animation_machine_v64.py
          python3 tools/patch_animation_fbx_upright_v65.py
          python3 tools/patch_anim_autorig_css_v66.py
          python3 tools/patch_autorig_marker_modes_v69.py
          python3 tools/patch_autorig_reference_skeleton_v70.py
          python3 tools/patch_fbx_upright_bake_v71.py
          python3 tools/patch_marker_autodetect_v72.py
      - name: Mesin loader FBX
        run: node tools/fbx_loader_machine_v67.mjs --modules=/tmp/df3d-runtime/node_modules
      - name: Mesin ekstrak struktur bone
        run: |
          node tools/bone_extract_machine_v68.mjs --modules=/tmp/df3d-runtime/node_modules
          if ls asset/fbx-loader/*.fbx asset/fbx-loader/*.FBX >/dev/null 2>&1; then
            test -s app/src/main/assets/rig_reference.json
            grep -q "RIG_REFERENCE_V68" app/src/main/assets/rig_reference.json
          else
            echo "asset/fbx-loader kosong - rig_reference.json tidak dibuat"
          fi
      - name: Verify isolated machines and split storage
        run: |
          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/create.html
          test -f app/src/main/assets/auto.html
          grep -q "window.__OBJECT_MACHINE__='edit';" app/src/main/assets/index.html
          grep -q "window.__OBJECT_MACHINE__='create';" app/src/main/assets/create.html
          grep -q "window.__OBJECT_MACHINE__='auto';" app/src/main/assets/auto.html
          grep -q "AUTO_MACHINE_V39" app/src/main/assets/auto.html
          grep -q "AUTO_MACHINE_THEME_V39" app/src/main/assets/auto.html
          grep -q "AUTO_RIG_PORTAL_V41" app/src/main/assets/auto.html
          grep -q "autoRigPortalV41" app/src/main/assets/auto.html
          ! grep -q "AUTO_RIG_PORTAL_V41" app/src/main/assets/index.html
          ! grep -q "AUTO_RIG_PORTAL_V41" app/src/main/assets/create.html
          grep -q "AUTO_RIG_REPLACE_OLD_V50" app/src/main/assets/auto.html
          grep -q "stripOldRigV50" app/src/main/assets/auto.html
          ! grep -q "AUTO_RIG_REPLACE_OLD_V50" app/src/main/assets/index.html
          ! grep -q "AUTO_RIG_REPLACE_OLD_V50" app/src/main/assets/create.html
          grep -q "AUTO_RIG_BONE_TIDY_V51" app/src/main/assets/auto.html
          ! grep -q "AUTO_RIG_BONE_TIDY_V51" app/src/main/assets/index.html
          ! grep -q "AUTO_RIG_BONE_TIDY_V51" app/src/main/assets/create.html
          grep -q "ANIM_LIBRARY_V52" app/src/main/assets/auto.html
          ! grep -q "ANIM_LIBRARY_V52" app/src/main/assets/index.html
          ! grep -q "ANIM_LIBRARY_V52" app/src/main/assets/create.html
          grep -q "AUTO_RIG_WEIGHTS_V53" app/src/main/assets/auto.html
          ! grep -q "AUTO_RIG_WEIGHTS_V53" app/src/main/assets/index.html
          ! grep -q "AUTO_RIG_WEIGHTS_V53" app/src/main/assets/create.html
          grep -q "AUTO_RIG_ALIGN_V54" app/src/main/assets/auto.html
          grep -q "mapCoreBonesV54" app/src/main/assets/auto.html
          ! grep -q "AUTO_RIG_ALIGN_V54" app/src/main/assets/index.html
          ! grep -q "AUTO_RIG_ALIGN_V54" app/src/main/assets/create.html
          grep -q "ANIM_LIB_SMARTMAP_V56" app/src/main/assets/auto.html
          ! grep -q "ANIM_LIB_SMARTMAP_V56" app/src/main/assets/index.html
          ! grep -q "ANIM_LIB_SMARTMAP_V56" app/src/main/assets/create.html
          grep -q "AUTO_RIG_MODE_V57" app/src/main/assets/auto.html
          grep -q "rebuildRigKeepWeightsV57" app/src/main/assets/auto.html
          ! grep -q "AUTO_RIG_MODE_V57" app/src/main/assets/index.html
          ! grep -q "AUTO_RIG_MODE_V57" app/src/main/assets/create.html
          grep -q "ANIM_LIB_GROUPS_V58" app/src/main/assets/auto.html
          ! grep -q "ANIM_LIB_GROUPS_V58" app/src/main/assets/index.html
          ! grep -q "ANIM_LIB_GROUPS_V58" app/src/main/assets/create.html
          grep -q "ANIM_LIB_BINDPOSE_V59" app/src/main/assets/auto.html
          ! grep -q "ANIM_LIB_BINDPOSE_V59" app/src/main/assets/index.html
          grep -q "ANIM_LIB_RESTOFFSET_V60" app/src/main/assets/auto.html
          grep -q "ANIM_LIB_LEGSCOPY_V61" app/src/main/assets/auto.html
          grep -q "ANIM_LIB_GROUNDFACE_V62" app/src/main/assets/auto.html
          grep -q "ANIM_LIB_ARMSCOPY_V63" app/src/main/assets/auto.html
          test -f app/src/main/assets/animation.html
          grep -q "window.__OBJECT_MACHINE__='animation';" app/src/main/assets/animation.html
          grep -q "ANIMATION_MACHINE_THEME_V64" app/src/main/assets/animation.html
          grep -q "objectPortalAnimV64" app/src/main/assets/index.html
          grep -q "objectPortalAnimV64" app/src/main/assets/create.html
          grep -q "objectPortalAnimV64" app/src/main/assets/auto.html
          grep -q "objectPortalAnimV64" app/src/main/assets/animation.html
          grep -q "window.__OBJECT_STORAGE_PREFIX__='animation:';" app/src/main/assets/animation.html
          grep -q "ANIMATION_FBX_UPRIGHT_V65" app/src/main/assets/animation.html
          ! grep -q "ANIMATION_FBX_UPRIGHT_V65" app/src/main/assets/auto.html
          ! grep -q "ANIMATION_FBX_UPRIGHT_V65" app/src/main/assets/index.html
          ! grep -q "ANIMATION_FBX_UPRIGHT_V65" app/src/main/assets/create.html
          grep -q "ANIM_AUTORIG_CSS_V66" app/src/main/assets/animation.html
          grep -q 'html\[data-object-machine="animation"\] body.auto-rig-v42 #editorScreen .toolrail' app/src/main/assets/animation.html
          grep -q 'html\[data-object-machine="animation"\] body.auto-rig-v42 #editorScreen .viewtools' app/src/main/assets/animation.html
          grep -q 'html\[data-object-machine="animation"\] #editorScreen .auto-rig-portal-v41' app/src/main/assets/animation.html
          ! grep -q "ANIM_AUTORIG_CSS_V66" app/src/main/assets/auto.html
          ! grep -q "ANIM_AUTORIG_CSS_V66" app/src/main/assets/index.html
          ! grep -q "ANIM_AUTORIG_CSS_V66" app/src/main/assets/create.html
          grep -q "AUTO_RIG_MARKER_MODES_V69" app/src/main/assets/animation.html
          grep -q "MK_FINGERS_V69" app/src/main/assets/animation.html
          grep -q "markerModeV69" app/src/main/assets/animation.html
          grep -q "headTop" app/src/main/assets/animation.html
          ! grep -q "const markerDefs=" app/src/main/assets/animation.html
          ! grep -q "AUTO_RIG_MARKER_MODES_V69" app/src/main/assets/auto.html
          ! grep -q "AUTO_RIG_MARKER_MODES_V69" app/src/main/assets/index.html
          ! grep -q "AUTO_RIG_MARKER_MODES_V69" app/src/main/assets/create.html
          grep -q "const markerDefs=" app/src/main/assets/auto.html
          grep -q "AUTO_RIG_REFERENCE_SKELETON_V70" app/src/main/assets/animation.html
          grep -q "loadRigReferenceV70" app/src/main/assets/animation.html
          grep -q "ANCHOR_PAIRS_V70" app/src/main/assets/animation.html
          grep -q "buildAnchorMapV70" app/src/main/assets/animation.html
          ! grep -q "specs.hips=makeBone('Hips'" app/src/main/assets/animation.html
          grep -q "refRolesV70" app/src/main/assets/animation.html
          ! grep -q "LeftUpLeg',calf:'LeftLeg'" app/src/main/assets/animation.html
          ! grep -q "AUTO_RIG_REFERENCE_SKELETON_V70" app/src/main/assets/auto.html
          grep -q "specs.hips=makeBone('Hips'" app/src/main/assets/auto.html
          ! grep -q "refRolesV70" app/src/main/assets/auto.html
          grep -q "FBX_UPRIGHT_BAKE_V71" app/src/main/assets/animation.html
          grep -q "bakeDownV71" app/src/main/assets/animation.html
          ! grep -q "FBX_UPRIGHT_BAKE_V71" app/src/main/assets/auto.html
          ! grep -q "FBX_UPRIGHT_BAKE_V71" app/src/main/assets/index.html
          ! grep -q "FBX_UPRIGHT_BAKE_V71" app/src/main/assets/create.html
          grep -q "MARKER_AUTODETECT_V72" app/src/main/assets/animation.html
          grep -q "markerDariRigV72" app/src/main/assets/animation.html
          grep -q "jariDalamTanganV72" app/src/main/assets/animation.html
          ! grep -q "MARKER_AUTODETECT_V72" app/src/main/assets/auto.html
          ! grep -q "MARKER_AUTODETECT_V72" app/src/main/assets/index.html
          ! grep -q "MARKER_AUTODETECT_V72" app/src/main/assets/create.html
          grep -q "EDIT_MACHINE_V32" app/src/main/assets/index.html
          grep -q "CREATE_MACHINE_V32" app/src/main/assets/create.html
          grep -q "objectPortalAutoV39" app/src/main/assets/index.html
          grep -q "objectPortalAutoV39" app/src/main/assets/create.html
          grep -q "objectPortalAutoV39" app/src/main/assets/auto.html
          grep -q "MODE_STORAGE_SPLIT_V40" app/src/main/assets/index.html
          grep -q "MODE_STORAGE_SPLIT_V40" app/src/main/assets/create.html
          grep -q "MODE_STORAGE_SPLIT_V40" app/src/main/assets/auto.html
          grep -q "EXPORT_SKINNED_CLONE_V44" app/src/main/assets/index.html
          grep -q "EXPORT_SKINNED_CLONE_V44" app/src/main/assets/create.html
          grep -q "EXPORT_SKINNED_CLONE_V44" app/src/main/assets/auto.html
          grep -q "FBX_PRIMARY_FBXLOADER_V55" app/src/main/assets/index.html
          grep -q "FBX_PRIMARY_FBXLOADER_V55" app/src/main/assets/create.html
          grep -q "FBX_PRIMARY_FBXLOADER_V55" app/src/main/assets/auto.html
          ! grep -q "const c=src.clone(true)" app/src/main/assets/index.html
          ! grep -q "const c=src.clone(true)" app/src/main/assets/auto.html
          grep -q "modeStorageSuffixV40" app/src/main/assets/index.html
          grep -q "FBX_VIEWER_REPAIR_V38" app/src/main/assets/index.html
          grep -q "FBX_VIEWER_REPAIR_V38" app/src/main/assets/create.html
          grep -q "FBX_VIEWER_REPAIR_V38" app/src/main/assets/auto.html
          ! grep -q "AUTO_MACHINE_RUNTIME_V35" app/src/main/assets/auto.html
          ! grep -q "autoViewerCanvasV37" app/src/main/assets/auto.html
          ! grep -q "cdn.jsdelivr.net/npm/three@" app/src/main/assets/index.html
          ! grep -q "cdn.jsdelivr.net/npm/three@" app/src/main/assets/create.html
          ! grep -q "cdn.jsdelivr.net/npm/three@" app/src/main/assets/auto.html
          ! grep -q "cdn.jsdelivr.net/npm/assimpjs@" app/src/main/assets/auto.html
          test -f app/src/main/assets/vendor/assimpjs/dist/assimpjs.wasm
      - name: Verify editor feature markers in every machine
        run: |
          for doc in index create auto; do
            f="app/src/main/assets/$doc.html"
            for m in LIVE_EDIT_SELECT_UNDO_V28 liveUndoBtn liveRedoBtn \
                     SKELETON_UNDO_REDO_V29 skelUndoBtn skelRedoBtn \
                     skeletonUndoActionV29 skeletonRedoActionV29 \
                     SKELETON_LIVE_EDIT_V20 SKELETON_TOOL_ROUTES_V21 SKELETON_VISUAL_V23 \
                     SKELETON_BONE_MANAGE_V24 SKELETON_RIG_V26 SKELETON_TRACKPAD_ZOOM_V27 \
                     OBJECT_UI_V9 OFFLINE_RUNTIME_V1 PROJECT_ROUNDTRIP_V20 loadFbxWithAssimp; do
              if ! grep -q "$m" "$f"; then echo "HILANG: $m di $doc.html"; exit 1; fi
            done
            for b in OBJECT_UNDO_REDO_V10 OBJECT_UNDO_REDO_V12 \
                     skeletonUndoActionV21 pushSkeletonHistoryV21 \
                     skeletonRedoActionV21 skeletonRedoBtn; do
              if grep -q "$b" "$f"; then echo "TERLARANG: $b hidup lagi di $doc.html"; exit 1; fi
            done
          done
          echo "Semua penanda fitur editor utuh di ketiga mesin"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: 3D-Model-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
