name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Patch FBX parser to Assimp WASM
        run: python3 tools/patch_fbx_assimp.py
      - name: Patch universal Layers
        run: python3 tools/patch_layers_v2.py
      - name: Patch separate Mesh Layers
        run: python3 tools/patch_mesh_layers.py
      - name: Patch touch Part Drag
        run: python3 tools/patch_part_drag.py
      - name: Patch touch Part Rotate and Scale
        run: python3 tools/patch_part_rotate_scale.py
      - name: Patch Part Transform Axis Lock
        run: python3 tools/patch_part_axis_lock.py
      - name: Patch Android Part Drag fix
        run: python3 tools/patch_part_drag_android_fix.py
      - name: Patch Part Transform stability
        run: python3 tools/patch_part_transform_stability.py
      - name: Patch long-press Part transform menu
        run: python3 tools/patch_part_longpress_menu.py
      - name: Patch Mesh Layer part locks
        run: python3 tools/patch_mesh_part_lock.py
      - name: Harden Mesh Layer part locks
        run: python3 tools/patch_mesh_part_lock_v2.py
      - name: Fix long-press popup on Android
        run: python3 tools/patch_part_longpress_fix_v2.py
      - name: Turn existing Select into Live Edit portal
        run: python3 tools/patch_live_edit_select.py
      - name: Wire Live Edit Move Rotate Scale
        run: python3 tools/patch_live_edit_transform.py
      - name: Patch Project Manager
        run: python3 tools/patch_project_manager.py
      - name: Patch selectable project folder storage
        run: python3 tools/patch_project_folder_saf.py
      - name: Verify editor pipeline
        run: |
          grep -q "assimpjs@0.0.10" app/src/main/assets/index.html
          grep -q "loadFbxWithAssimp" app/src/main/assets/index.html
          grep -q 'id="layersScreen"' app/src/main/assets/index.html
          grep -q 'id="meshLayersScreen"' app/src/main/assets/index.html
          grep -q 'id="partDragBtn"' app/src/main/assets/index.html
          grep -q 'id="partRotateBtn"' app/src/main/assets/index.html
          grep -q 'id="partScaleBtn"' app/src/main/assets/index.html
          grep -q "partTransformAxis" app/src/main/assets/index.html
          grep -q "PART_DRAG_ANDROID_FIX_V2" app/src/main/assets/index.html
          grep -q "PART_TRANSFORM_STABILITY_V1" app/src/main/assets/index.html
          grep -q "PART_LONGPRESS_MENU_V1" app/src/main/assets/index.html
          grep -q "PART_LONGPRESS_FIX_V2" app/src/main/assets/index.html
          grep -q "MESH_PART_LOCK_V1" app/src/main/assets/index.html
          grep -q "MESH_PART_LOCK_V2" app/src/main/assets/index.html
          grep -q "lockedPartGuard" app/src/main/assets/index.html
          grep -q "LIVE_EDIT_SELECT_V1" app/src/main/assets/index.html
          grep -q "LIVE_EDIT_TRANSFORM_V1" app/src/main/assets/index.html
          grep -q 'id="liveEditSelectBtn"' app/src/main/assets/index.html
          grep -q 'id="liveMoveBtn"' app/src/main/assets/index.html
          grep -q 'id="liveRotateBtn"' app/src/main/assets/index.html
          grep -q 'id="liveScaleBtn"' app/src/main/assets/index.html
          grep -q 'id="livePanPad"' app/src/main/assets/index.html
          grep -q 'id="projectsScreen"' app/src/main/assets/index.html
          grep -q 'id="projectFolderBtn"' app/src/main/assets/index.html
          grep -q "chooseProjectFolderSaf" app/src/main/assets/index.html
          grep -q "saveCurrentProjectToFolder" app/src/main/assets/index.html
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3D-Model-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
