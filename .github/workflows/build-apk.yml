name: Build Android APK

on:
  push:
    branches: [ "main", "GPT2", "Kodok" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: actions/setup-node@v4
      - name: Bundle offline runtime
        run: |
          rm -rf /tmp/df3d-runtime app/src/main/assets/vendor
          mkdir -p /tmp/df3d-runtime app/src/main/assets/vendor/three app/src/main/assets/vendor/assimpjs
          cd /tmp/df3d-runtime && npm init -y >/dev/null 2>&1 && npm install --no-audit --no-fund three@0.180.0 assimpjs@0.0.10
          cp -R node_modules/three/build "$GITHUB_WORKSPACE/app/src/main/assets/vendor/three/build"
          cp -R node_modules/three/examples "$GITHUB_WORKSPACE/app/src/main/assets/vendor/three/examples"
          cp -R node_modules/assimpjs/dist "$GITHUB_WORKSPACE/app/src/main/assets/vendor/assimpjs/dist"
      - name: Apply editor pipeline
        run: |
          python3 tools/patch_fbx_assimp.py
          python3 tools/patch_fbx_viewer_repair_v38.py
          python3 tools/patch_layers_v2.py
          python3 tools/patch_mesh_layers.py
          python3 tools/patch_part_drag.py
          python3 tools/patch_part_rotate_scale.py
          python3 tools/patch_part_axis_lock.py
          python3 tools/patch_part_drag_android_fix.py
          python3 tools/patch_part_transform_stability.py
          python3 tools/patch_part_longpress_menu.py
          python3 tools/patch_mesh_part_lock.py
          python3 tools/patch_mesh_part_lock_v2.py
          python3 tools/patch_part_longpress_fix_v2.py
          python3 tools/patch_live_edit_select.py
          python3 tools/patch_live_edit_orbit_trackpad_v8.py
          python3 tools/patch_live_edit_transform.py
          python3 tools/patch_live_edit_transform_v2.py
          python3 tools/patch_live_edit_selection_state_v2.py
          python3 tools/patch_live_edit_state_v3.py
          python3 tools/patch_live_edit_touch_transform_v3.py
          python3 tools/patch_live_edit_touch_transform_v4.py
          python3 tools/patch_live_edit_touch_transform_v5.py
          python3 tools/patch_project_manager.py
          python3 tools/patch_project_folder_saf.py
          python3 tools/patch_project_saf_uri_v17.py
          python3 tools/patch_project_import_v18.py
          python3 tools/patch_project_export_v19.py
          python3 tools/patch_project_roundtrip_v20.py
          python3 tools/patch_skinned_mesh_direct_v6.py
          python3 tools/patch_live_edit_visual_preview_v7.py
