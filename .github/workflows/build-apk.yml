name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Node for offline runtime assets
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bundle Three.js and AssimpJS into APK assets
        run: |
          rm -rf /tmp/df3d-runtime app/src/main/assets/vendor
          mkdir -p /tmp/df3d-runtime app/src/main/assets/vendor/three app/src/main/assets/vendor/assimpjs
          cd /tmp/df3d-runtime
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund three@0.180.0 assimpjs@0.0.10
          cp -R node_modules/three/build "$GITHUB_WORKSPACE/app/src/main/assets/vendor/three/build"
          cp -R node_modules/three/examples "$GITHUB_WORKSPACE/app/src/main/assets/vendor/three/examples"
          cp -R node_modules/assimpjs/dist "$GITHUB_WORKSPACE/app/src/main/assets/vendor/assimpjs/dist"
      - name: Patch FBX parser to Assimp WASM
        run: python3 tools/patch_fbx_assimp.py
      - name: Patch universal Layers
        run: python3 tools/patch_layers_v2.py
      - name: Patch separate Mesh Layers
        run: python3 tools/patch_mesh_layers.py
      - name: Patch touch Part Drag
        run: python3 tools/patch_part_drag.py
      - name: Patch touch Part Rotate and Scale
        run: python3 tools/patch_part_rotate_scale.py
      - name: Patch Part Transform Axis Lock
        run: python3 tools/patch_part_axis_lock.py
      - name: Patch Android Part Drag fix
        run: python3 tools/patch_part_drag_android_fix.py
      - name: Patch Part Transform stability
        run: python3 tools/patch_part_transform_stability.py
      - name: Patch long-press Part transform menu
        run: python3 tools/patch_part_longpress_menu.py
      - name: Patch Mesh Layer part locks
        run: python3 tools/patch_mesh_part_lock.py
      - name: Harden Mesh Layer part locks
        run: python3 tools/patch_mesh_part_lock_v2.py
      - name: Fix long-press popup on Android
        run: python3 tools/patch_part_longpress_fix_v2.py
      - name: Turn existing Select into Live Edit portal
        run: python3 tools/patch_live_edit_select.py
      - name: Add isolated Orbit trackpad for Live Edit
        run: python3 tools/patch_live_edit_orbit_trackpad_v8.py
      - name: Wire Live Edit Move Rotate Scale
        run: python3 tools/patch_live_edit_transform.py
      - name: Fix Live Edit transforms with dedicated gesture path
        run: python3 tools/patch_live_edit_transform_v2.py
      - name: Fix Live Edit selected part state
        run: python3 tools/patch_live_edit_selection_state_v2.py
      - name: Fix Live Edit exit and OrbitControls restore
        run: python3 tools/patch_live_edit_state_v3.py
      - name: Make Live Edit touch transforms persistent
        run: python3 tools/patch_live_edit_touch_transform_v3.py
      - name: Own Live Edit transform gestures at viewport capture
        run: python3 tools/patch_live_edit_touch_transform_v4.py
      - name: Use native Android Touch Events for Live Edit transforms
        run: python3 tools/patch_live_edit_touch_transform_v5.py
      - name: Patch Project Manager
        run: python3 tools/patch_project_manager.py
      - name: Patch selectable project folder storage
        run: python3 tools/patch_project_folder_saf.py
      - name: Fix Android project SAF document URI handling
        run: python3 tools/patch_project_saf_uri_v17.py
      - name: Add Import Project support
        run: python3 tools/patch_project_import_v18.py
      - name: Add Export Project support
        run: python3 tools/patch_project_export_v19.py
      - name: Make Save Export Import Project one roundtrip format
        run: python3 tools/patch_project_roundtrip_v20.py
      - name: Fix SkinnedMesh direct transform and saved project recovery
        run: python3 tools/patch_skinned_mesh_direct_v6.py
      - name: Fix live SkinnedMesh visual preview while dragging
        run: python3 tools/patch_live_edit_visual_preview_v7.py
      - name: Redesign Object editor UI
        run: python3 tools/patch_object_ui_v9.py
      - name: Add dedicated Skeleton live edit mode
        run: python3 tools/patch_skeleton_live_edit_v20.py
      - name: Add real Object undo redo history
        run: python3 tools/patch_object_undo_redo_v10.py
      - name: Add touch scrub adjusters to Transform fields
        run: python3 tools/patch_transform_adjust_scrub_v11.py
      - name: Fix Android Live Edit undo redo capture
        run: python3 tools/patch_object_undo_redo_v12.py
      - name: Add Export All and selective GLB options
        run: python3 tools/patch_export_all_v13.py
      - name: Restore selected Mesh Transform panel
        run: python3 tools/patch_mesh_transform_panel_v14.py
      - name: Add Mesh Layers rename delete and add mesh
        run: python3 tools/patch_mesh_layer_manage_v16.py
      - name: Fix adaptive feet-aligned floor grid
        run: python3 tools/patch_adaptive_floor_grid_v17.py
      - name: Make runtime fully offline
        run: python3 tools/patch_offline_runtime.py
      - name: Verify editor pipeline and offline runtime
        run: |
          grep -q "loadFbxWithAssimp" app/src/main/assets/index.html
          grep -q "OFFLINE_RUNTIME_V1" app/src/main/assets/index.html
          grep -q "PROJECT_IMPORT_V18" app/src/main/assets/index.html
          grep -q "PROJECT_EXPORT_V19" app/src/main/assets/index.html
          grep -q "PROJECT_ROUNDTRIP_V20" app/src/main/assets/index.html
          grep -q "saveProjectV20" app/src/main/assets/index.html
          grep -q "exportProjectV20" app/src/main/assets/index.html
          grep -q "importProjectV20" app/src/main/assets/index.html
          grep -q "PROJECT_CHUNK_WRITER_V20" app/src/main/java/com/differentfreelancer/model3d/MainActivity.java
          grep -q "beginProjectWrite" app/src/main/java/com/differentfreelancer/model3d/MainActivity.java
          grep -q "appendProjectWriteChunk" app/src/main/java/com/differentfreelancer/model3d/MainActivity.java
          grep -q "finishProjectWrite" app/src/main/java/com/differentfreelancer/model3d/MainActivity.java
          grep -q "PROJECT_IMPORT_JSON_MIME_V18" app/src/main/java/com/differentfreelancer/model3d/MainActivity.java
          grep -q "OBJECT_UI_V9" app/src/main/assets/index.html
          grep -q "SKELETON_LIVE_EDIT_V20" app/src/main/assets/index.html
          grep -q "skeletonModeBtn" app/src/main/assets/index.html
          grep -q "skeletonViewBtn" app/src/main/assets/index.html
          grep -q "skeletonAddBoneBtn" app/src/main/assets/index.html
          grep -q "skeletonDuplicateBoneBtn" app/src/main/assets/index.html
          grep -q "skeletonRigBtn" app/src/main/assets/index.html
          grep -q "OBJECT_UNDO_REDO_V10" app/src/main/assets/index.html
          grep -q "TRANSFORM_ADJUST_SCRUB_V11" app/src/main/assets/index.html
          grep -q "OBJECT_UNDO_REDO_V12" app/src/main/assets/index.html
          grep -q "EXPORT_ALL_V13" app/src/main/assets/index.html
          grep -q "MESH_TRANSFORM_PANEL_V14" app/src/main/assets/index.html
          grep -q "MESH_LAYER_MANAGE_V16" app/src/main/assets/index.html
          grep -q "ADAPTIVE_FLOOR_GRID_V17" app/src/main/assets/index.html
          grep -q "PROJECT_SAF_URI_V17" app/src/main/java/com/differentfreelancer/model3d/MainActivity.java
          grep -q "treeRootDocument" app/src/main/java/com/differentfreelancer/model3d/MainActivity.java
          grep -q "meshAddInput" app/src/main/assets/index.html
          grep -q "renameMeshLayer" app/src/main/assets/index.html
          grep -q "deleteMeshLayer" app/src/main/assets/index.html
          grep -q "meshTransformPanel" app/src/main/assets/index.html
          grep -q "SAVE / EXPORT ALL" app/src/main/assets/index.html
          grep -q "objectTrackpadDrawer" app/src/main/assets/index.html
          grep -q "objectCameraPad" app/src/main/assets/index.html
          grep -q "LIVE_EDIT_SELECT_V1" app/src/main/assets/index.html
          grep -q "LIVE_EDIT_SKINNED_DIRECT_V6" app/src/main/assets/index.html
          grep -q "LIVE_EDIT_VISUAL_PREVIEW_V7" app/src/main/assets/index.html
          grep -q 'id="layersScreen"' app/src/main/assets/index.html
          grep -q 'id="meshLayersScreen"' app/src/main/assets/index.html
          ! grep -q "cdn.jsdelivr.net/npm/three@" app/src/main/assets/index.html
          ! grep -q "cdn.jsdelivr.net/npm/assimpjs@" app/src/main/assets/index.html
          test -f app/src/main/assets/vendor/assimpjs/dist/assimpjs.wasm
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3D-Model-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
