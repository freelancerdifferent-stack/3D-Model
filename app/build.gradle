plugins {
    id 'com.android.application'
}

android {
    namespace 'com.differentfreelancer.model3d'
    compileSdk 35

    defaultConfig {
        applicationId 'com.differentfreelancer.model3d'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
